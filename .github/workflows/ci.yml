name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Validate Windows host-task installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/install-broker-windows-task.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoProfile -File "$PWD/scripts/install-broker-windows-task.ps1" `
            -BrokerExe "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -TokenFile "$PWD/README.md" -TaskName WWR-CI-WhatIf -WhatIf

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go test -race ./...

  arm64-build:
    name: Go arm64 cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Build Linux and Windows Go binaries for arm64
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/wsl-win-relay-arm64"
          mkdir -p "$output"
          while read -r goos package name; do
            GOOS="$goos" GOARCH=arm64 go build -o "$output/$name" "$package"
          done <<'EOF'
          linux ./cmd/wsl-proxy wsl-proxy-linux
          windows ./cmd/win-relay wsl-win-relay.exe
          windows ./cmd/win-broker wsl-win-broker.exe
          windows ./cmd/win-connector wsl-win-connector.exe
          EOF

  native:
    name: Linux native interposer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: ./scripts/build-wsl.sh
      - run: sh -n scripts/*.sh scripts/wsl-win-relay-run
      - run: ./scripts/test-user-installer.sh
      - run: ./scripts/test-launcher-preflight.sh
      - run: ./scripts/test-kernel-supervisor.sh
      - run: ./scripts/test-interposer.sh
      - run: ./scripts/test-transparent-relay.sh
      - run: GOPROXY=off ./scripts/test-broker-connector.sh
      - run: GOPROXY=off ./scripts/test-broker-reconnect.sh
      - run: GOPROXY=off ./scripts/test-broker-auto-rebind.sh
      - run: GOPROXY=off ./scripts/test-broker-restart.sh
      - run: GOPROXY=off ./scripts/test-broker-supervisor.sh
      - run: ./scripts/test-broker-service-wrapper.sh
      - run: ./scripts/test-broker-installer.sh
