name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go test ./...
      - run: go vet ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: go test -race ./...

  native:
    name: Linux native interposer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - run: ./scripts/build-wsl.sh
      - run: sh -n scripts/*.sh scripts/wsl-win-relay-run
      - run: ./scripts/test-interposer.sh
      - run: GOPROXY=off ./scripts/test-broker-connector.sh
      - run: GOPROXY=off ./scripts/test-broker-reconnect.sh
      - run: GOPROXY=off ./scripts/test-broker-auto-rebind.sh
      - run: GOPROXY=off ./scripts/test-broker-restart.sh
      - run: GOPROXY=off ./scripts/test-broker-supervisor.sh
